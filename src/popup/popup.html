<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feed Destroyer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup" aria-label="Feed Destroyer status">
      <header class="brand">
        <img class="brand-icon" src="icons/icon-48.png" alt="" width="48" height="48">
        <div>
          <h1>Feed Destroyer</h1>
          <p class="status">Always on</p>
        </div>
      </header>

      <p class="message">
        Nukes distracting feeds on YouTube and X while leaving the useful parts alone.
        Less scroll, more intent.
      </p>

      <div class="setting">
        <div class="setting-copy">
          <label class="setting-label" for="hideXForYou">Hide X &quot;For you&quot; feed</label>
          <p id="hideXForYouHint" class="setting-hint">Turn this off when you want to browse it.</p>
        </div>
        <input
          id="hideXForYou"
          class="toggle"
          type="checkbox"
          role="switch"
          aria-describedby="hideXForYouHint"
        >
      </div>

      <label class="focus-label" for="focusTarget">Today I am focusing on</label>
      <input
        id="focusTarget"
        class="focus-input"
        type="text"
        maxlength="80"
        autocomplete="off"
        placeholder="10K MRR for my apps"
      >

      <p class="hint">This shows up where the feed used to be.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
